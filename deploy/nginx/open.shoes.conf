## ═══════════════════════════════════════════════════════════════
## open.shoes — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/open.shoes.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5180, systemd unit openvibe-shoes) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the forms, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for the model pages and the catalogue; private,
## no-store for anything drawn for a signed-in person). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=shoes_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shoes_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shoes_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name open.shoes www.open.shoes;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://open.shoes$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.open.shoes;

    ssl_certificate     /etc/letsencrypt/live/open.shoes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.shoes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://open.shoes$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name open.shoes;

    ssl_certificate     /etc/letsencrypt/live/open.shoes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.shoes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/open.shoes.access.log;
    error_log  /var/log/nginx/open.shoes.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=shoes_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5180;
    }

    location /auth/ {
        limit_req zone=shoes_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5180;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=shoes_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5180;
    }

    # ── Forms and other writes: the price watch, the pasted link, the drop reminder ──
    location ~ ^/(shoe/[a-z0-9-]+/watch|track|drops/[^/]+/remind)$ {
        limit_req zone=shoes_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5180;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5180/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5180/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5180;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
